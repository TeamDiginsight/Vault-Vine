name: Deploy to Supabase

on:
  push:
    branches:
      - main
      - dev
      - qa
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Verify Node.js installation
        run: |
          node --version
          npm --version
          which node

      - name: Install Supabase CLI
        run: |
          echo "Installing Supabase CLI..."
          npm install -g supabase
          supabase --version
        continue-on-error: false

      - name: Authenticate with Supabase
        run: |
          echo "Authenticating with Supabase project: rwxernfvmhfosymlblek"
          supabase link --project-ref rwxernfvmhfosymlblek
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: List migrations
        run: |
          echo "Migrations to push:"
          ls -la supabase/migrations/
        continue-on-error: true

      - name: Push migrations to Supabase
        run: |
          echo "Pushing migrations to Supabase..."
          supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deployment complete
        if: success()
        run: echo "✅ Deployment to Supabase successful!"

      - name: Deployment failed
        if: failure()
        run: |
          echo "❌ Deployment failed"
          exit 1
