name: Deploy to Supabase

on:
  push:
    branches:
      - main
      - dev
      - qa
      - prod
  pull_request:
    branches:
      - main
      - dev
      - qa
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Debug - Print environment info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Supabase Project: rwxernfvmhfosymlblek"
          supabase --version

      - name: Authenticate with Supabase
        run: |
          supabase link --project-ref rwxernfvmhfosymlblek
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Check Supabase status
        run: supabase status
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Dry run migrations (Pull Request)
        if: github.event_name == 'pull_request'
        run: supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations to Supabase (Push)
        if: github.event_name == 'push'
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify deployment
        run: supabase status
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Success message
        if: success()
        run: echo "✅ Deployment successful!"

      - name: Failure message
        if: failure()
        run: echo "❌ Deployment failed - Check logs above"
